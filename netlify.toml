[build]
  command = "npm run build"
  publish = "dist/frontend"
  base = "services/inventory-web"

[dev]
  command = "npm start --prefix services/inventory-web"
  port = 4200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Environment variables should be configured in Netlify UI.
