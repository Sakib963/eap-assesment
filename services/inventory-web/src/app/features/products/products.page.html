<section class="grid gap-5 lg:gap-6">
  <nz-card class="rounded-sm border border-[#d6e0df] bg-[linear-gradient(165deg,#f7fbfa,#ebf2f2)]" [nzBordered]="false">
    <div class="flex flex-wrap items-start justify-between gap-3">
      <div class="flex flex-col gap-2">
        <p class="m-0 text-[0.72rem] font-extrabold uppercase tracking-[0.14em] text-[#375f65]">Catalog Studio</p>
        <h1 class="my-1 text-[clamp(1.45rem,2.8vw,1.95rem)] font-extrabold text-[#17343a]">Products</h1>
        <p class="m-0 text-[0.86rem] text-[#17343a]/70">Manage SKU records, stock state, pricing, and lifecycle status.</p>
      </div>
      <button nz-button nzType="primary" nzSize="large" (click)="openCreateDrawer()">
        <nz-icon nzType="plus" nzTheme="outline"></nz-icon>
        Add Product
      </button>
    </div>
  </nz-card>

  <app-shared-filter-panel
    title="Product Filters"
    [form]="filterForm"
    [fields]="filterFields"
    [searchDebounceMs]="400"
    (filtersChange)="onFiltersChange()"
  ></app-shared-filter-panel>

  <app-shared-data-list
    [config]="productListConfig"
    [items]="products()"
    [loading]="loading()"
    [page]="page()"
    [pageSize]="pageSize()"
    [total]="totalProducts()"
    (pageChange)="onPageChange($event)"
  ></app-shared-data-list>

  <nz-drawer
    [nzVisible]="drawerVisible()"
    [nzTitle]="isEditing() ? 'Edit Product' : 'Create Product'"
    [nzWidth]="drawerWidth()"
    nzWrapClassName="products-form-drawer"
    [nzClosable]="true"
    [nzMaskClosable]="!saving()"
    [nzFooter]="drawerFooter"
    (nzOnClose)="closeDrawer()"
  >
    <ng-container *nzDrawerContent>
      <form nz-form [nzLayout]="'vertical'" [formGroup]="productForm" class="grid gap-3">
        <nz-form-item>
          <nz-form-label [nzRequired]="true">Product Name</nz-form-label>
          <nz-form-control [nzValidateStatus]="productForm.controls.name" [nzErrorTip]="productForm.get('name')?.hasError('required') ? 'Product name is required' : productForm.get('name')?.hasError('minlength') ? 'Name must be at least 2 characters' : productForm.get('name')?.hasError('maxlength') ? 'Name must not exceed 100 characters' : ''">
            <input nz-input nzSize="large" formControlName="name" placeholder="Laptop Pro 15" />
          </nz-form-control>
        </nz-form-item>

        <nz-form-item>
          <nz-form-label [nzRequired]="true">Category</nz-form-label>
          <nz-form-control [nzValidateStatus]="productForm.controls.category_id" [nzErrorTip]="productForm.get('category_id')?.hasError('required') ? 'Please select a category' : ''">
            <nz-select class="w-full" nzSize="large" formControlName="category_id" nzPlaceHolder="Select category">
              @for (category of categories(); track category.id) {
                <nz-option [nzValue]="category.id" [nzLabel]="category.name"></nz-option>
              }
            </nz-select>
          </nz-form-control>
        </nz-form-item>

        <nz-form-item>
          <nz-form-label>Description (Optional)</nz-form-label>
          <nz-form-control>
            <textarea nz-input nzSize="large" rows="3" formControlName="description" placeholder="Brief description of the product"></textarea>
          </nz-form-control>
        </nz-form-item>

        <!-- Price and Current Stock in 2-column grid -->
        <div class="grid grid-cols-1 gap-4 md:grid-cols-2">
          <nz-form-item>
            <nz-form-label [nzRequired]="true">Price</nz-form-label>
            <nz-form-control [nzValidateStatus]="productForm.controls.price" [nzErrorTip]="productForm.get('price')?.hasError('required') ? 'Price is required' : productForm.get('price')?.hasError('min') ? 'Price must be at least $0.01' : ''">
              <nz-input-number
                [nzMin]="0.01"
                [nzStep]="0.01"
                [nzPrecision]="2"
                nzSize="large"
                nzPrefix="$"
                formControlName="price"
                placeholder="0.00"
                [style.width.%]="100"
                class="w-full"
              ></nz-input-number>
            </nz-form-control>
          </nz-form-item>

          <nz-form-item>
            <nz-form-label [nzRequired]="true">Current Stock</nz-form-label>
            <nz-form-control [nzValidateStatus]="productForm.controls.current_stock" [nzErrorTip]="productForm.get('current_stock')?.hasError('required') ? 'Current stock is required' : productForm.get('current_stock')?.hasError('min') ? 'Stock cannot be negative' : ''">
              <nz-input-number
                [nzMin]="0"
                nzSize="large"
                formControlName="current_stock"
                placeholder="0"
                [style.width.%]="100"
                class="w-full"
              ></nz-input-number>
            </nz-form-control>
          </nz-form-item>
        </div>

        <!-- Min Stock Threshold and Status in 2-column grid -->
        <div class="grid grid-cols-1 gap-4 md:grid-cols-2">
          <nz-form-item>
            <nz-form-label [nzRequired]="true">Min. Stock Threshold</nz-form-label>
            <nz-form-control [nzValidateStatus]="productForm.controls.min_stock_threshold" [nzErrorTip]="productForm.get('min_stock_threshold')?.hasError('required') ? 'Threshold is required' : productForm.get('min_stock_threshold')?.hasError('min') ? 'Threshold cannot be negative' : ''">
              <nz-input-number
                [nzMin]="0"
                nzSize="large"
                formControlName="min_stock_threshold"
                placeholder="5"
                [style.width.%]="100"
                class="w-full"
              ></nz-input-number>
            </nz-form-control>
          </nz-form-item>

          <nz-form-item>
            <nz-form-label [nzRequired]="true">Status</nz-form-label>
            <nz-form-control [nzValidateStatus]="productForm.controls.status" [nzErrorTip]="productForm.get('status')?.hasError('required') ? 'Status is required' : ''">
              <nz-select class="w-full" nzSize="large" formControlName="status" nzPlaceHolder="Select status">
                <nz-option nzValue="active" nzLabel="Active"></nz-option>
                <nz-option nzValue="out_of_stock" nzLabel="Out of Stock"></nz-option>
                <nz-option nzValue="inactive" nzLabel="Inactive"></nz-option>
              </nz-select>
            </nz-form-control>
          </nz-form-item>
        </div>
      </form>
    </ng-container>
  </nz-drawer>

  <ng-template #drawerFooter>
    <div class="flex justify-end gap-2">
      <button nz-button nzType="default" nzSize="large" [disabled]="saving()" (click)="closeDrawer()">
        <nz-icon nzType="close" nzTheme="outline"></nz-icon>
        Cancel
      </button>
      <button nz-button nzType="primary" nzSize="large" [nzLoading]="saving()" (click)="submitProduct()">
        @if (isEditing()) {
          <nz-icon nzType="edit" nzTheme="outline"></nz-icon>
        } @else {
          <nz-icon nzType="plus" nzTheme="outline"></nz-icon>
        }
        {{ isEditing() ? 'Update' : 'Create' }}
      </button>
    </div>
  </ng-template>
</section>
