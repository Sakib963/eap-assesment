<main class="forgot-shell">
  <nz-card class="forgot-card" [nzBordered]="true">
    <h2 class="mb-1 text-2xl font-extrabold text-[#17343a]">Reset Password</h2>
    <p class="mb-5 text-sm text-[#35575c]">Follow 3 steps to reset your password.</p>

    @if (step() === 1) {
      <form nz-form [formGroup]="emailForm" (ngSubmit)="submitEmail()" nzLayout="vertical" class="grid gap-3">
        <nz-form-item>
          <nz-form-label [nzRequired]="true">Email</nz-form-label>
          <nz-form-control nzErrorTip="Please enter a valid email address">
            <input nz-input formControlName="email" type="email" placeholder="name@example.com" />
          </nz-form-control>
        </nz-form-item>

        <button nz-button nzType="primary" [nzLoading]="loading()" class="w-full" type="submit">
          Verify Email
        </button>
      </form>
    }

    @if (step() === 2) {
      <form nz-form [formGroup]="otpForm" (ngSubmit)="submitOtp()" nzLayout="vertical" class="grid gap-3">
        <nz-form-item>
          <nz-form-label [nzRequired]="true">OTP</nz-form-label>
          <nz-form-control nzErrorTip="OTP is required">
            <input nz-input formControlName="otp" placeholder="Enter OTP" />
          </nz-form-control>
          <p class="forgot-otp-hint mt-1">Default OTP for this setup: <strong>1234</strong></p>
        </nz-form-item>

        <div class="grid grid-cols-2 gap-2">
          <button nz-button nzType="default" type="button" (click)="goToStep(1)">Back</button>
          <button nz-button nzType="primary" [nzLoading]="loading()" type="submit">Verify OTP</button>
        </div>
      </form>
    }

    @if (step() === 3) {
      <form nz-form [formGroup]="passwordForm" (ngSubmit)="submitPasswordReset()" nzLayout="vertical" class="grid gap-3">
        <nz-form-item>
          <nz-form-label [nzRequired]="true">New Password</nz-form-label>
          <nz-form-control nzErrorTip="Minimum 6 characters required">
            <input nz-input type="password" formControlName="new_password" placeholder="New password" />
          </nz-form-control>
        </nz-form-item>

        <nz-form-item>
          <nz-form-label [nzRequired]="true">Confirm Password</nz-form-label>
          <nz-form-control [nzErrorTip]="passwordForm.hasError('passwordMismatch') && passwordForm.get('confirm_password')?.touched ? 'Passwords do not match' : 'Please confirm password'">
            <input nz-input type="password" formControlName="confirm_password" placeholder="Confirm password" />
          </nz-form-control>
        </nz-form-item>

        <div class="grid grid-cols-2 gap-2">
          <button nz-button nzType="default" type="button" (click)="goToStep(2)">Back</button>
          <button nz-button nzType="primary" [nzLoading]="loading()" type="submit">Reset Password</button>
        </div>
      </form>
    }

    <div class="mt-5 text-center text-sm">
      <a routerLink="/auth/login" class="text-[#1f5c63] font-semibold">Back to login</a>
    </div>
  </nz-card>
</main>
