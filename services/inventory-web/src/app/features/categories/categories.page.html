<section class="grid gap-5 lg:gap-6">
  <nz-card class="rounded-sm border border-[#d6e0df] bg-[linear-gradient(165deg,#f7fbfa,#ebf2f2)]" [nzBordered]="false">
    <div class="flex flex-wrap items-start justify-between gap-3">
      <div class="flex flex-col gap-2">
        <p class="m-0 text-[0.72rem] font-extrabold uppercase tracking-[0.14em] text-[#375f65]">Taxonomy Control</p>
        <h1 class="my-1 text-[clamp(1.45rem,2.8vw,1.95rem)] font-extrabold text-[#17343a]">Categories</h1>
        <p class="m-0 text-[0.86rem] text-[#17343a]/70">Manage product grouping as a first-class resource, separate from product records.</p>
      </div>
      <button nz-button nzType="primary" nzSize="large" (click)="openCreateDrawer()">
        <nz-icon nzType="plus" nzTheme="outline"></nz-icon>
        Add Category
      </button>
    </div>
  </nz-card>

  <app-shared-filter-panel
    title="Category Filters"
    [form]="filterForm"
    [fields]="filterFields"
    [searchDebounceMs]="400"
    (filtersChange)="onFiltersChange()"
  ></app-shared-filter-panel>

  <app-shared-data-list
    [config]="categoryListConfig"
    [items]="categories()"
    [loading]="loading()"
    [page]="page()"
    [pageSize]="pageSize()"
    [total]="totalCategories()"
    (pageChange)="onPageChange($event)"
  ></app-shared-data-list>

  <nz-drawer
    [nzVisible]="drawerVisible()"
    [nzTitle]="isEditing() ? 'Edit Category' : 'Create Category'"
    [nzWidth]="drawerWidth()"
    [nzClosable]="true"
    [nzMaskClosable]="!saving()"
    [nzFooter]="drawerFooter"
    (nzOnClose)="closeDrawer()"
  >
    <ng-container *nzDrawerContent>
      <form nz-form [nzLayout]="'vertical'" [formGroup]="categoryForm" class="grid gap-3">
        <nz-form-item>
          <nz-form-label [nzRequired]="true">Category Name</nz-form-label>
          <nz-form-control>
            <input nz-input nzSize="large" formControlName="name" placeholder="Electronics" />
          </nz-form-control>
        </nz-form-item>

        <nz-form-item>
          <nz-form-label>Description (Optional)</nz-form-label>
          <nz-form-control>
              <textarea nz-input nzSize="large" rows="3" formControlName="description" placeholder="Description"></textarea>
          </nz-form-control>
        </nz-form-item>

        <nz-form-item>
          <nz-form-label [nzRequired]="true">Status</nz-form-label>
          <nz-form-control>
              <nz-select class="w-full" nzSize="large" formControlName="status" nzPlaceHolder="Select status">
              <nz-option nzValue="active" nzLabel="Active"></nz-option>
              <nz-option nzValue="inactive" nzLabel="Inactive"></nz-option>
            </nz-select>
          </nz-form-control>
        </nz-form-item>
      </form>
    </ng-container>
  </nz-drawer>

  <ng-template #drawerFooter>
    <div class="flex justify-end gap-2">
        <button nz-button nzType="default" nzSize="large" [disabled]="saving()" (click)="closeDrawer()">
          <nz-icon nzType="close" nzTheme="outline"></nz-icon>
          Cancel
        </button>
        <button nz-button nzType="primary" nzSize="large" [nzLoading]="saving()" (click)="submitCategory()">
          @if (isEditing()) {
            <nz-icon nzType="edit" nzTheme="outline"></nz-icon>
          } @else {
            <nz-icon nzType="plus" nzTheme="outline"></nz-icon>
          }
          {{ isEditing() ? 'Update' : 'Create' }}
      </button>
    </div>
  </ng-template>
</section>
